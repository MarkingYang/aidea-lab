<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="905" viewBox="0 0 1200 905" font-family="PingFang SC,Arial,sans-serif"><rect width="1200" height="905" fill="#f7f9fc"/><rect x="24" y="24" width="1152" height="857" rx="20" fill="#fff"/><text x="55" y="60" font-size="17" fill="#61748b" font-weight="600">AI 产品与 Agent 系统学习指南  /  图 16</text><text x="55" y="101" font-size="30" fill="#172b49" font-weight="700">从已定位的瓶颈，选择最小可验证的改动</text><svg id="16-selection" x="60" y="126" width="1080" height="690" viewBox="0 0 1080 690"><text x="30" y="35" font-size="23" fill="#203652" font-weight="600">已定位的瓶颈</text><text x="380" y="35" font-size="23" fill="#203652" font-weight="600">候选改动</text><text x="780" y="35" font-size="23" fill="#203652" font-weight="600">验证重点</text><rect x="12" y="65" width="1056" height="82" rx="16" fill="#eaf7f3"/><text x="32" y="114" font-size="23" fill="#203652" font-weight="400">缺少当前私有知识</text><text x="336" y="114" font-size="26" fill="#6b819a" font-weight="400">→</text><text x="380" y="114" font-size="23" fill="#203652" font-weight="400">RAG：检索与知识治理</text><text x="780" y="114" font-size="22" fill="#45617e" font-weight="400">查召回、证据与时效</text><rect x="12" y="164" width="1056" height="82" rx="16" fill="#edf4ff"/><text x="32" y="213" font-size="23" fill="#203652" font-weight="400">任务说明或规则不清</text><text x="336" y="213" font-size="26" fill="#6b819a" font-weight="400">→</text><text x="380" y="213" font-size="23" fill="#203652" font-weight="400">Prompt：指令与示例</text><text x="780" y="213" font-size="22" fill="#45617e" font-weight="400">查约束与任务表达</text><rect x="12" y="263" width="1056" height="82" rx="16" fill="#eaf7f3"/><text x="32" y="312" font-size="23" fill="#203652" font-weight="400">固定行为范式仍不稳定</text><text x="336" y="312" font-size="26" fill="#6b819a" font-weight="400">→</text><text x="380" y="312" font-size="23" fill="#203652" font-weight="400">评估 SFT，含 LoRA 方案</text><text x="780" y="312" font-size="22" fill="#45617e" font-weight="400">查示范质量与泛化</text><rect x="12" y="362" width="1056" height="82" rx="16" fill="#edf4ff"/><text x="32" y="411" font-size="23" fill="#203652" font-weight="400">可比较的行为偏好问题</text><text x="336" y="411" font-size="26" fill="#6b819a" font-weight="400">→</text><text x="380" y="411" font-size="23" fill="#203652" font-weight="400">评估 DPO / 经典 RLHF</text><text x="780" y="411" font-size="22" fill="#45617e" font-weight="400">查偏好一致性与收益</text><rect x="12" y="461" width="1056" height="82" rx="16" fill="#fff2df"/><text x="32" y="510" font-size="23" fill="#203652" font-weight="400">权限、执行或恢复失败</text><text x="336" y="510" font-size="26" fill="#6b819a" font-weight="400">→</text><text x="380" y="510" font-size="23" fill="#203652" font-weight="400">修工具、策略和 Runtime</text><text x="780" y="510" font-size="22" fill="#45617e" font-weight="400">查可信状态与副作用</text><rect x="12" y="585" width="1056" height="84" rx="16" fill="#f0ecf8"/><text x="32" y="620" font-size="23" fill="#55477a" font-weight="600">所有候选都要接受同一套验收</text><text x="32" y="653" font-size="23" fill="#203652" font-weight="400">业务硬约束 → 任务完成与接管 → 完整成本 → 延迟与交付负担</text></svg><text x="55" y="865" font-size="17" fill="#61748b" font-weight="400">这些是可组合的候选方案；选择依据是失败证据与独立评测，不是概念热度。</text></svg>