<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="840" viewBox="0 0 1200 840" font-family="PingFang SC,Arial,sans-serif"><rect width="1200" height="840" fill="#f7f9fc"/><rect x="24" y="24" width="1152" height="792" rx="20" fill="#fff"/><text x="55" y="60" font-size="17" fill="#61748b" font-weight="600">AI 产品与 Agent 系统学习指南  /  图 14</text><text x="55" y="101" font-size="30" fill="#172b49" font-weight="700">同一个售后需求，三种产品切入方式</text><svg id="14-competitors" x="60" y="126" width="1080" height="625" viewBox="0 0 1080 625"><rect x="12" y="0" width="342" height="495" rx="16" fill="#edf4ff"/><text x="35" y="48" font-size="28" fill="#203652" font-weight="700">Dify</text><text x="35" y="91" font-size="23" fill="#426384" font-weight="600">可视化应用流程</text><text x="35" y="145" font-size="19" fill="#61748b" font-weight="400">公开能力侧重点</text><text x="35" y="186" font-size="20" fill="#203652" font-weight="400">知识检索、模型与工具节点</text><text x="35" y="228" font-size="20" fill="#203652" font-weight="400">把处理路径连接成应用</text><text x="35" y="270" font-size="20" fill="#203652" font-weight="400">Agent 节点能力按版本核对</text><text x="35" y="337" font-size="19" fill="#61748b" font-weight="400">选型时要验证</text><text x="35" y="380" font-size="21" fill="#203652" font-weight="400">知识分支怎样配置？</text><text x="35" y="422" font-size="21" fill="#203652" font-weight="400">故障后能否查清与恢复？</text><rect x="372" y="0" width="342" height="495" rx="16" fill="#eaf7f3"/><text x="395" y="48" font-size="28" fill="#203652" font-weight="700">Copilot Studio</text><text x="395" y="91" font-size="23" fill="#426384" font-weight="600">已有企业能力的编排</text><text x="395" y="145" font-size="19" fill="#61748b" font-weight="400">公开能力侧重点</text><text x="395" y="186" font-size="20" fill="#203652" font-weight="400">主题、知识、工具与连接器</text><text x="395" y="228" font-size="20" fill="#203652" font-weight="400">连接现有企业系统和流程</text><text x="395" y="270" font-size="20" fill="#203652" font-weight="400">身份与凭证依触发方式核对</text><text x="395" y="337" font-size="19" fill="#61748b" font-weight="400">选型时要验证</text><text x="395" y="380" font-size="21" fill="#203652" font-weight="400">用谁的身份调用工具？</text><text x="395" y="422" font-size="21" fill="#203652" font-weight="400">已有系统接入成本多大？</text><rect x="732" y="0" width="342" height="495" rx="16" fill="#f1edfa"/><text x="755" y="48" font-size="28" fill="#203652" font-weight="700">Agentforce</text><text x="755" y="91" font-size="23" fill="#426384" font-weight="600">受约束的业务动作</text><text x="755" y="145" font-size="19" fill="#61748b" font-weight="400">公开能力侧重点</text><text x="755" y="186" font-size="20" fill="#203652" font-weight="400">把 Flow / Apex 等封装成动作</text><text x="755" y="228" font-size="20" fill="#203652" font-weight="400">明确输入、输出与调用条件</text><text x="755" y="270" font-size="20" fill="#203652" font-weight="400">按动作风险设置确认机制</text><text x="755" y="337" font-size="19" fill="#61748b" font-weight="400">选型时要验证</text><text x="755" y="380" font-size="21" fill="#203652" font-weight="400">怎样界定动作权限？</text><text x="755" y="422" font-size="21" fill="#203652" font-weight="400">结果能否核验并被审计？</text><rect x="12" y="522" width="1062" height="85" rx="16" fill="#fff4e3"/><text x="37" y="557" font-size="22" fill="#6e4c20" font-weight="600">统一对照条件</text><text x="37" y="588" font-size="21" fill="#203652" font-weight="400">同一业务任务、同一权限边界、同一失败场景，再比较完整成本与交付负担。</text></svg><text x="55" y="800" font-size="17" fill="#61748b" font-weight="400">依据本章官方资料做的教学归纳；不代表独占能力、厂商内部动机或性能排名。</text></svg>