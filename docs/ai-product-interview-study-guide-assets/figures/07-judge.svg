<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="825" viewBox="0 0 1200 825" font-family="PingFang SC,Arial,sans-serif"><rect width="1200" height="825" fill="#f7f9fc"/><rect x="24" y="24" width="1152" height="777" rx="20" fill="#fff"/><text x="55" y="60" font-size="17" fill="#61748b" font-weight="600">AI 产品与 Agent 系统学习指南  /  图 07</text><text x="55" y="101" font-size="30" fill="#172b49" font-weight="700">裁判总体正确率 90%，报警却未必可靠</text><svg id="07-judge" x="60" y="126" width="1080" height="610" viewBox="0 0 1080 610"><text x="285" y="36" font-size="24" fill="#203652" font-weight="600">专家：实际有问题</text><text x="677" y="36" font-size="24" fill="#203652" font-weight="600">专家：实际合格</text><text x="20" y="142" font-size="23" fill="#203652" font-weight="400">裁判：报警</text><text x="20" y="322" font-size="23" fill="#203652" font-weight="400">裁判：不报警</text><rect x="245" y="64" width="367" height="155" rx="16" fill="#e8f4ef"/><text x="273" y="131" font-size="50" fill="#203652" font-weight="700">18</text><text x="273" y="183" font-size="23" fill="#203652" font-weight="400">真阳性 · 查对了</text><rect x="638" y="64" width="367" height="155" rx="16" fill="#fff0da"/><text x="666" y="131" font-size="50" fill="#203652" font-weight="700">8</text><text x="666" y="183" font-size="23" fill="#203652" font-weight="400">假阳性 · 误报</text><rect x="245" y="245" width="367" height="155" rx="16" fill="#ffe7e4"/><text x="273" y="312" font-size="50" fill="#203652" font-weight="700">2</text><text x="273" y="364" font-size="23" fill="#203652" font-weight="400">假阴性 · 漏报</text><rect x="638" y="245" width="367" height="155" rx="16" fill="#e8f4ef"/><text x="666" y="312" font-size="50" fill="#203652" font-weight="700">72</text><text x="666" y="364" font-size="23" fill="#203652" font-weight="400">真阴性 · 判对了</text><rect x="20" y="446" width="328" height="140" rx="16" fill="#f0f3f8"/><text x="40" y="481" font-size="22" fill="#203652" font-weight="400">总体正确率</text><text x="40" y="514" font-size="20" fill="#61748b" font-weight="400">(18 + 72) / 100</text><text x="40" y="562" font-size="34" fill="#295fa7" font-weight="700">90%</text><rect x="368" y="446" width="328" height="140" rx="16" fill="#f0f3f8"/><text x="388" y="481" font-size="22" fill="#203652" font-weight="400">问题召回率</text><text x="388" y="514" font-size="20" fill="#61748b" font-weight="400">18 / (18 + 2)</text><text x="388" y="562" font-size="34" fill="#295fa7" font-weight="700">90%</text><rect x="716" y="446" width="328" height="140" rx="16" fill="#f0f3f8"/><text x="736" y="481" font-size="22" fill="#203652" font-weight="400">报警精确率</text><text x="736" y="514" font-size="20" fill="#61748b" font-weight="400">18 / (18 + 8)</text><text x="736" y="562" font-size="34" fill="#295fa7" font-weight="700">69.2%</text></svg><text x="55" y="785" font-size="17" fill="#61748b" font-weight="400">教学样本 100 条；以“回答有问题”为正类，专家判断作为参考。</text></svg>