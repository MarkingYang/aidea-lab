services:
  artalk:
    image: artalk/artalk-go:latest
    container_name: artalk
    restart: unless-stopped
    ports:
      - "127.0.0.1:23366:23366"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      ATK_TIMEZONE: Asia/Shanghai
      ATK_LOCALE: zh-CN
      ATK_APP_KEY: ${ATK_APP_KEY:?请在同目录 .env 中设置 ATK_APP_KEY}
      ATK_SITE_DEFAULT: AINoteAtlas
      ATK_SITE_URL: https://ainoteatlas.com
      ATK_TRUSTED_DOMAINS: https://ainoteatlas.com https://www.ainoteatlas.com
      ATK_AUTH_ANONYMOUS: "true"
      ATK_HTTP_PROXY_HEADER: X-Forwarded-For
      ATK_IMG_UPLOAD_ENABLED: "false"
      ATK_FRONTEND_PLACEHOLDER: 留下你的观察、问题或不同意见…

